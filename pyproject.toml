[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdl2-gibbie-server"
version = "0.1.0"
description = "Read-only STATUS_SPEC gateway for a lab bench driven by something other than the dashboard. One instance per bench (Gibbie sample prep, Process Chemistry); devices are config-driven."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Yang Cao", email = "cyrilcaoyang@gmail.com" }]
dependencies = [
    "sdl-lab-contract",          # shared STATUS_SPEC wire types (v1.2)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "paramiko>=3.3",             # Flex REPL-session probe over SSH (read-only)
    "pyserial>=3.5",             # serial-port enumeration only; never opens a port
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
gibbie-server = "gibbie_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
sdl-lab-contract = { git = "https://github.com/AccelerationConsortium/sdl-lab-contract", tag = "v1.2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
